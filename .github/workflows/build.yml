name: 'Build Skeletyl Firmware'

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v7
        with:
          # This AVR target needs LUFA; the other root submodules are unrelated.
          submodules: false
          fetch-depth: 1

      - name: Fetch LUFA USB stack
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 -- lib/lufa

      - name: Compile Firmware
        run: qmk compile -kb axl13/my_skeletyl -km default

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v7
        with:
          name: skeletyl-firmware
          path: axl13_my_skeletyl_default.hex
          if-no-files-found: error
          retention-days: 30
